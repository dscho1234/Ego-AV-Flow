name: egoavflow-preprocess
channels:
  - nvidia/label/cuda-12.1.1
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # CUDA and host compilers for the extensions built by scripts/install_preprocessing.sh
  # (DROID-SLAM, GroundingDINO, detectron2); nvcc 12.1 supports gcc <= 12
  - nvidia/label/cuda-12.1.1::cuda-toolkit
  - gxx_linux-64=11
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # mmcv 1.3.9 imports pkg_resources in its setup.py (removed in recent setuptools)
      - setuptools==69.5.1
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.0
      - scipy==1.15.3
      - opencv-python==4.8.0.76
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - zarr==2.12.0
      - numcodecs==0.10.2
      - imagecodecs==2023.7.10
      - matplotlib==3.10.7
      - plotly==6.3.1
      - imageio==2.37.0
      - imageio-ffmpeg==0.4.9
      - pillow==11.3.0
      - einops==0.8.1
      - timm==1.0.20
      - tqdm
      - requests
      - ninja
      # recording (Intel RealSense)
      - pyrealsense2
      # marker frame (pose graph)
      - gtsam==4.2
      # query point transfer (DIFT on Stable Diffusion 2.1)
      - xformers @ https://download.pytorch.org/whl/cu121/xformers-0.0.29.post1-cp310-cp310-manylinux_2_28_x86_64.whl
      - diffusers==0.15.0
      - transformers==4.42.4
      - huggingface-hub==0.23.4
      - accelerate==0.29.3
      - safetensors==0.6.2
      # HaMeR and ViTPose
      - pytorch-lightning==2.5.5
      - smplx==0.1.28
      - pyrender==0.1.45
      - scikit-image==0.25.2
      - yacs==0.1.8
      - xtcocotools==1.14.3
      - pandas
      - json_tricks
      - munkres
      - gdown==5.2.0
      - pyrootutils==1.0.4
      - webdataset==1.0.2
      - rich
      # GroundingDINO, Segment Anything, Cutie
      - addict==2.4.0
      - yapf==0.43.0
      - supervision==0.27.0
      - pycocotools==2.0.10
      - easydict
      - hickle==5.0.3
      - gitpython
      - av
