name: egoavflow
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.0
      - scipy==1.15.3
      # diffusers 0.11 still imports `huggingface_hub.cached_download` (removed in huggingface-hub 0.26)
      - diffusers==0.11.0
      - huggingface-hub==0.23.4
      - accelerate==0.29.3
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - timm==1.0.20
      - einops==0.8.1
      - zarr==2.12.0
      - numcodecs==0.10.2
      - imagecodecs==2023.7.10
      - opencv-python==4.8.0.76
      - matplotlib==3.10.7
      - imageio==2.37.0
      - tqdm
      - wandb
      # evaluation only
      - open3d==0.19.0
      - urdf-parser-py==0.0.4
