defaults:
  - common
  - _self_

board:
  squares_x: 3
  squares_y: 5
  square_size: 0.052  # m
  marker_size: 0.0416  # m
  aruco_dict: DICT_4X4_250
  reference_marker_id: 1  # defines the marker frame

# Pose graph noise (standard deviations). Marker detections are only loosely trusted.
pose_graph:
  odom_sigma_rot_deg: 0.1
  odom_sigma_pos: 0.01
  marker_sigma_rot_deg: 1.0
  marker_sigma_pos: 0.35

save_marker_images: false  # episode_<i>/marker_detections/frame_<k>.png
